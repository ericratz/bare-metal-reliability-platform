#Identical on node1 (Ubuntu) and node2 (Rocky). Everything that differs between
#the two nodes lives in .env, so the deployed tree stays byte-for-byte the same
#across both distros — that sameness is what makes the rolling update a matter
#of swapping a tag rather than reconciling two hand-maintained configs.
services:
  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: brp-api:${APP_VERSION:-dev}
    container_name: brp-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    #/slo queries Prometheus, which runs on the HOST, not in this container.
    #PROM_URL was 127.0.0.1:9090 and could never have worked from in here —
    #that is the container's own loopback. Podman supplies
    #host.containers.internal automatically and also aliases
    #host.docker.internal; adding it here gives both runtimes the same name, so
    #PROM_URL stays one identical value on both nodes.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      #no default: an instance that does not know which node it is on would
      #report "unknown" to the LB, Prometheus, and the health monitor at once.
      NODE_NAME: ${NODE_NAME:?NODE_NAME must be set - copy .env.example to .env}
      APP_VERSION: ${APP_VERSION:-dev}
      PROM_URL: ${PROM_URL:-http://127.0.0.1:9090}
    #journald on the nodes so the health monitor's `journalctl -t brp-api`
    #check can read app logs alongside OS logs. Defaults to json-file so the
    #stack still comes up on a dev box without systemd.
    logging:
      driver: ${LOG_DRIVER:-json-file}

#Pinned rather than left to Docker's address pool, because node1's ufw rule for
#container-to-host :9090 has to name a source subnet — and a rule pointing at a
#range Docker picked at random stops matching the moment the network is
#recreated. Compose had assigned 172.18.0.0/16 here; that was luck, not a
#contract. See RUNBOOK.md §1d.
#
#node2 needs no equivalent: pasta routes the container to the host directly and
#firewalld never sees the traffic.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
