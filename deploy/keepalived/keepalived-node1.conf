#/etc/keepalived/keepalived.conf  on node1 (192.168.71.251, Ubuntu 26.04)
#
#### ONE VALUE MUST BE EDITED BEFORE THIS WILL WORK ####
#  192.168.71.245 — the floating virtual IP. MUST NOT be inside the router's DHCP
#          pool, or DHCP will eventually lease it to some other device and
#          you get an intermittent, maddening address conflict.
#########################################################
#
#The LAN is 192.168.68.0/22 — that is 192.168.68.0 through 192.168.71.255,
#not the /24 you would assume from the address alone. The prefix on the
#virtual_ipaddress below MUST match, or the VIP is advertised with the wrong
#network mask and traffic from parts of the subnet fails to route to it.

global_defs {
    router_id node1

    #keepalived refuses to run scripts that are writable by non-root once this
    #is on. Leave it enabled — a VRRP health script runs as root on every
    #interval, so a world-writable one is a straightforward root escalation.
    enable_script_security
    script_user root
}

vrrp_script check_nginx {
    script "/etc/keepalived/check_nginx.sh"
    interval 2      #run every 2s
    timeout 3       #kill the check if it hangs, treat as failure
    fall 2          #2 consecutive failures before acting — rides out a blip
    rise 2          #2 consecutive successes before recovering

    #NO weight, deliberately. Weight 0 (the default) is FAULT mode: `fall`
    #failures put this instance into FAULT, so it resigns with a priority-0
    #advert and drops the VIP. A backup receiving priority 0 promotes itself
    #immediately, and that path is checked BEFORE the nopreempt guard, so it
    #works regardless of nopreempt on the peer.
    #
    #This previously read `weight -20`, reasoning that 110-20=90 falls below
    #node2's 100 "so the VIP moves." It does not. A non-zero weight only
    #ADJUSTS PRIORITY — it never changes state. node1 stayed MASTER at 90 and
    #kept advertising, and node2, holding `nopreempt`, declined to take over
    #from a lower-priority master because declining is exactly what nopreempt
    #is for. Nothing resigned, so nothing moved.
    #
    #Measured, not theorised — Drill A, 2026-08-04 01:25:12Z: nginx stopped on
    #node1, 57 consecutive dropped requests at the VIP, zero VRRP transitions
    #on either node, and no recovery until nginx was restarted BY HAND. The
    #priority gap was never the binding constraint; the absence of a state
    #change was. See CHANGELOG.md and RUNBOOK.md §3 Drill A.
}

vrrp_instance BRP_VIP {
    #Both nodes are declared BACKUP on purpose. `nopreempt` is IGNORED on an
    #instance declared MASTER, so the usual MASTER/BACKUP pairing gives you
    #preemption whether you asked for it or not. Two BACKUPs with different
    #priorities hold an election on startup and the higher one wins — same
    #outcome, except nopreempt is now honoured.
    state BACKUP
    interface enp1s0

    #Must match on both nodes, and must not collide with any other VRRP group
    #on the LAN. If something else on your network already uses 51, both
    #groups will fight over each other's adverts.
    virtual_router_id 51

    priority 110    #node1 is preferred while healthy
    advert_int 1    #advertise every 1s; failover lands around 3-4s

    #Without this, a recovering node snatches the VIP back the instant it
    #returns — a second outage during recovery, right when you are least
    #expecting one. With it, node2 keeps serving until it has its own reason
    #to hand the VIP over. Requires state BACKUP above.
    nopreempt

    #Not security — VRRP has no real authentication and this is sent in the
    #clear. It stops this group from being confused with an unrelated VRRP
    #group on the same LAN. Only the first 8 characters are significant.
    authentication {
        auth_type PASS
        auth_pass brpvrrp1
    }

    #If either node is on wifi, comment out the multicast default and use
    #unicast instead — consumer APs frequently mangle multicast, which shows
    #up as both nodes believing they are MASTER (split brain).
    #unicast_src_ip 192.168.71.251
    #unicast_peer {
    #    192.168.71.252
    #}

    virtual_ipaddress {
        192.168.71.245/22 dev enp1s0
    }

    track_script {
        check_nginx
    }

    notify /etc/keepalived/notify.sh
}
