#/etc/keepalived/keepalived.conf  on node2 (192.168.71.252, Rocky Linux 10.2)
#
#Identical to node1's except router_id, priority, and the unicast addresses.
#See keepalived-node1.conf for the reasoning behind each block — it is not
#repeated here, so read that one first.
#
#### ONE VALUE MUST BE EDITED BEFORE THIS WILL WORK ####
#  192.168.71.250 — must be the SAME value as in keepalived-node1.conf, with the same
#          /22 prefix. The LAN is 192.168.68.0/22, not a /24.
#########################################################
#
#Rocky-specific, and it will bite: firewalld must permit VRRP, which is IP
#protocol 112 — not a TCP or UDP port, so `--add-port` cannot express it:
#
#    sudo firewall-cmd --permanent --add-protocol=vrrp
#    sudo firewall-cmd --reload
#
#Without this, node2 never hears node1's adverts, concludes the peer is gone,
#and claims the VIP. Both nodes then hold it: split brain, and traffic goes to
#whichever one the switch's ARP cache last learned.

global_defs {
    router_id node2
    enable_script_security
    script_user root
}

vrrp_script check_nginx {
    script "/etc/keepalived/check_nginx.sh"
    interval 2
    timeout 3
    fall 2
    rise 2
    weight -20      #on failure: 100 - 20 = 80
}

vrrp_instance BRP_VIP {
    state BACKUP
    interface enp1s0
    virtual_router_id 51

    priority 100    #lower than node1, so node1 wins a cold-start election
    advert_int 1
    nopreempt

    authentication {
        auth_type PASS
        auth_pass brpvrrp1
    }

    #unicast_src_ip 192.168.71.252
    #unicast_peer {
    #    192.168.71.251
    #}

    virtual_ipaddress {
        192.168.71.250/22 dev enp1s0
    }

    track_script {
        check_nginx
    }

    notify /etc/keepalived/notify.sh
}
