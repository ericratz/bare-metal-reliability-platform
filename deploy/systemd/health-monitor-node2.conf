#/etc/systemd/system/health-monitor.service.d/10-fleet.conf   on node2
#
#Identical in shape to node1's. See health-monitor-node1.conf for the full
#reasoning on drop-ins, the one-active-line rule, the Environment= replacement
#semantics, and the syntax caveat — none of it is repeated here, so read that
#file first.
#
#Four things genuinely differ on this node, and all four are traps:
#
#  1. Rocky names sshd.service, not ssh.service.
#  2. firewalld exists here and does not exist on node1.
#  3. The app container is NOT in HEALTH_SERVICES. See the block below — this
#     is the one most likely to be "fixed" by someone who has not read why.
#  4. The monitor's own repo ships systemd/node2.conf, a drop-in for this same
#     unit. If both land, systemd merges them and `node2.conf` wins on every
#     shared variable — letters sort after digits, so 10-fleet.conf loads
#     first and is overwritten. That silently restores the full end-state
#     service list and undoes the trim, on the one node where the overlap
#     exists. Verify with the merged-Environment check in node1's header
#     after installing; do not go by filenames.
#
#After every change:
#    sudo systemctl daemon-reload
#    sudo systemctl start health-monitor.service
#    systemctl is-failed health-monitor.service      #expect: inactive

[Service]

#--- services ----------------------------------------------------------------
#Baseline: sshd and firewalld.
#
#DO NOT ADD brp-api HERE. It is a rootless *user* unit generated by Quadlet
#under systemctl --user, and `systemctl --failed` at the system level cannot
#see it — the monitor would report it permanently not-installed, which under
#the configuration-fault rule is a standing WARNING that never clears. Podman
#is daemonless, so unlike node1 there is no daemon unit to watch as a proxy
#either. The node2-health endpoint below is what covers this container, and it
#covers it better: it tests that the app answers, not that a process exists.
Environment=HEALTH_SERVICES=sshd,firewalld
#Environment=HEALTH_SERVICES=sshd,firewalld,nginx                        #§1c
#Environment=HEALTH_SERVICES=sshd,firewalld,nginx,prometheus             #§1d
#Environment=HEALTH_SERVICES=sshd,firewalld,nginx,prometheus,keepalived  #§1e

#--- rootless container checks (node2 only) ----------------------------------
#Absorbed from the monitor repo's own systemd/node2.conf, which used to sit
#alongside this file as a second drop-in and silently won HEALTH_SERVICES
#because letters sort after digits. Its content lives here so the node has
#exactly one authoritative drop-in; do not reinstall the original.
#
#Rootless containers belong to the user that started them. root's `podman ps`
#queries root's own store, finds it empty, and reports nothing wrong.
Environment=HEALTH_CONTAINER_USER=ericratz

#Required BY the line above and not separable from it. HEALTH_CONTAINER_USER
#runs `su -`, which needs the target user's home directory to build a login
#session, and the shipped unit's ProtectHome=yes hides it. Set one without the
#other and the container check fails outright rather than degrading quietly.
#
#At baseline rather than staged to §1b on purpose: staging them separately is
#exactly how the half-configured state above gets created. They move together
#or not at all.
ProtectHome=no

#--- app endpoints -----------------------------------------------------------
#node1-health is reported but not scored into this node's exit code; only
#loopback, this host's own addresses, and the VIP are scored.
#
#ACTIVE EMPTY assignment, not a commented line — see node1's file. A commented
#variable inherits the shipped unit's value; only an active line overrides it.
Environment=HEALTH_APP_ENDPOINTS=
#§1b
#Environment=HEALTH_APP_ENDPOINTS=node2-health=http://127.0.0.1:8000/health,node1-health=http://192.168.71.251:8000/health
#§1d
#Environment=HEALTH_APP_ENDPOINTS=node2-health=http://127.0.0.1:8000/health,node1-health=http://192.168.71.251:8000/health,fleet-slo=http://127.0.0.1:8000/slo
#§1e
#Environment=HEALTH_APP_ENDPOINTS=node2-health=http://127.0.0.1:8000/health,node1-health=http://192.168.71.251:8000/health,fleet-slo=http://127.0.0.1:8000/slo,vip=http://192.168.71.245/health

#--- VIP ---------------------------------------------------------------------
#§1e. node2 is the backup and normally holds nothing — held: false is the
#correct, healthy state here and never degrades this node's status.
#
#Expect answered_by to name node1's MAC (24:1c:04:14:42:ce). Anything that does
#not start 24:1c:04 is not one of ours and means another device has claimed the
#VIP; d8:44:89:a0:66:60 is the appliance that squats .250 and is never
#legitimate on .245. See RUNBOOK.md §1e.
#
#Active and empty until then — the shipped unit sets .250, the appliance.
Environment=HEALTH_VIP=
#§1e
#Environment=HEALTH_VIP=192.168.71.245

#--- report path -------------------------------------------------------------
#§1c. Same ExecStart-override caveat as node1 — read it there.
#ExecStart=
#ExecStart=/usr/bin/python3 -m agent.monitor --all --html /var/www/health/report.html
