#/etc/systemd/system/health-monitor.service.d/10-fleet.conf   on node1
#
#A drop-in, never an edit to health-monitor.service itself. That unit ships
#from the linux-health-monitor repo and is replaced wholesale on its next
#install, taking any in-place edits with it. A drop-in survives.
#
#### HOW TO USE THIS FILE ####
#
#Every entry is tagged with the RUNBOOK.md §1 step that introduces it. Install
#the file with only the baseline lines active, then move the active line down
#one as you finish each step.
#
#Keep EXACTLY ONE line active per variable. systemd takes the last assignment
#if several are present, so extra active lines are not an error — they are just
#a silent trap for whoever reads this next.
#
#The file is the checklist, and that is deliberate: HEALTH_SERVICES and
#HEALTH_APP_ENDPOINTS start trimmed so the monitor's exit code is meaningful
#from the first run instead of sitting at a standing WARNING for the weeks it
#takes to build the platform. The cost of that choice is precisely this file —
#a component deployed but never uncommented here is a component nobody is
#watching, and nothing will tell you.
#
#After every change:
#    sudo systemctl daemon-reload
#    sudo systemctl start health-monitor.service
#    systemctl is-failed health-monitor.service      #expect: inactive
#
#If that does not come back clean, stop and fix it before the next step. A
#quiet baseline is only worth keeping if you verify it at each stage — that is
#the whole return on trimming the lists in the first place.
#
#### THIS FILE MUST BE THE ONLY DROP-IN SETTING THESE VARIABLES ####
#
#systemd merges every *.conf in health-monitor.service.d/ and the last writer
#wins, ordered lexicographically. Digits sort before letters, so this file
#(installed as 10-fleet.conf) LOSES to anything named nodeN.conf — and the
#monitor's own repo ships per-node drop-ins of exactly that shape. The override
#is silent: this file is present, correct, and ignored.
#
#Never reason about it from filenames. Check the merged result:
#
#    ls /etc/systemd/system/health-monitor.service.d/
#    systemctl show health-monitor.service -p Environment --no-pager \
#      | tr ' ' '\n' | grep HEALTH_
#
#One .conf, and HEALTH_SERVICES showing the trimmed baseline rather than the
#monitor's shipped end state. If a second drop-in is there, remove it.
#
#### SYNTAX ####
#
#Comma-separated lists; endpoints as name=url. Confirmed against the parser,
#not inferred: get_monitored_services() splits on comma and strips each name,
#and parse_endpoints() splits on comma then partitions each item on the first
#`=` (a bare URL is named after itself). A JSON object is accepted as an
#alternative form.
#
#Still worth a `systemctl cat health-monitor.service --no-pager` before §1b —
#not for format, but to catch a stale drop-in or a unit that was never
#reinstalled after a monitor upgrade.
#
#Environment= REPLACES the shipped value for a variable rather than appending
#to it. Each line below therefore carries the complete list, not just the entry
#being added.

[Service]

#--- services ----------------------------------------------------------------
#Baseline is what exists before any platform work: the Docker daemon and sshd.
#Compose containers are not systemd units — the daemon is what systemd can see,
#so watching it is the closest available proxy.
#
#Ubuntu names it ssh.service; Rocky names it sshd.service. Do not copy this
#line to node2.
Environment=HEALTH_SERVICES=docker,ssh
#Environment=HEALTH_SERVICES=docker,ssh,nginx                        #§1c
#Environment=HEALTH_SERVICES=docker,ssh,nginx,prometheus             #§1d
#Environment=HEALTH_SERVICES=docker,ssh,nginx,prometheus,keepalived  #§1e

#--- app endpoints -----------------------------------------------------------
#Nothing listens on :8000 or :80 until §1b, so the baseline is no endpoints at
#all. Registering them earlier books a guaranteed failure against the baseline
#this file exists to keep quiet.
#
#Only endpoints describing THIS host are scored into the exit code — loopback,
#one of its own addresses, or the VIP. node2-health is listed so it appears in
#the report and the fleet view, but a node2 outage will not mark node1's unit
#failed. During a real failover that distinction is what still tells you which
#node to look at.
#
#Baseline is an ACTIVE EMPTY assignment, not a commented-out line. Commenting
#it does not mean "no endpoints" — it means the shipped unit's own
#HEALTH_APP_ENDPOINTS applies, which lists both nodes, fleet-slo and vip, none
#of which exist yet. Every commented variable in this file inherits the unit's
#value; only an active line overrides it.
Environment=HEALTH_APP_ENDPOINTS=
#§1b
#Environment=HEALTH_APP_ENDPOINTS=node1-health=http://127.0.0.1:8000/health,node2-health=http://192.168.71.252:8000/health
#§1d — /slo reads from local Prometheus and degrades to unavailable without it
#Environment=HEALTH_APP_ENDPOINTS=node1-health=http://127.0.0.1:8000/health,node2-health=http://192.168.71.252:8000/health,fleet-slo=http://127.0.0.1:8000/slo
#§1e
#Environment=HEALTH_APP_ENDPOINTS=node1-health=http://127.0.0.1:8000/health,node2-health=http://192.168.71.252:8000/health,fleet-slo=http://127.0.0.1:8000/slo,vip=http://192.168.71.245/health

#--- VIP ---------------------------------------------------------------------
#§1e. Leave unset until keepalived is actually running: pointed at an address
#the platform does not own yet, every run reports answered_by for whatever else
#replies, turning a real finding into permanent background noise.
#
#This is also what classifies the vip= endpoint as local-to-every-node, so the
#VIP is scored on the backup as well as the holder. A VIP that does not answer
#is a fleet-level fault and both nodes should say so.
#
#Active and empty for the same reason as the endpoints above: the shipped unit
#sets HEALTH_VIP=192.168.71.250, the appliance address. Left commented, every
#run would report answered_by for hardware that is not ours.
Environment=HEALTH_VIP=
#§1e
#Environment=HEALTH_VIP=192.168.71.245

#--- report path -------------------------------------------------------------
#§1c, once nginx is serving. Points the HTML report at the web root that
#deploy/nginx/brp.conf's `location = /report` reads from. --html takes an
#absolute path and creates the parent tree itself, so no copy step is needed.
#
#WARNING — this overrides ExecStart, which pins the command line. If the
#monitor's own ExecStart ever changes upstream, this drop-in silently keeps
#running the old one. Re-diff it against `systemctl cat` after any monitor
#upgrade. Every other setting in this file is an Environment= line and does not
#have that problem; the right long-term fix is an env var for the report path
#on the monitor's side, which would let this block be deleted.
#
#The empty ExecStart= is required, not stylistic: without it systemd appends a
#second command rather than replacing the first.
#ExecStart=
#ExecStart=/usr/bin/python3 -m agent.monitor --all --html /var/www/health/report.html
