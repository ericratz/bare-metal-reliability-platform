#/etc/nginx/conf.d/brp.conf  (both nodes — nginx runs on each, VIP floats)

#upstream=$upstream_addr is the important field: it records WHICH node served
#each request. Without it the access log cannot prove traffic actually shifted
#during a rolling update, and the zero-downtime claim is unverifiable.
#$upstream_status carries every attempt when a retry happened (e.g. "502, 200"),
#so a retried request is distinguishable from one that simply succeeded.
log_format brp '$remote_addr [$time_iso8601] "$request" '
               'status=$status '
               'upstream=$upstream_addr '
               'upstream_status=$upstream_status '
               'rt=$request_time urt=$upstream_response_time';

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/brp_access.log brp;
    error_log  /var/log/nginx/brp_error.log warn;

    #Served by Nginx itself — never proxied. This is what keepalived's
    #vrrp_script checks, and the distinction is the whole point: it answers
    #"is this node's load balancer alive and serving?", NOT "are the backends
    #healthy?".
    #
    #Checking a proxied path instead would be a trap. If both app instances go
    #down, a proxied check fails on BOTH nodes, so VRRP would keep flipping the
    #VIP between two equally-broken load balancers — churn that fixes nothing
    #and makes the logs much harder to read. The VIP should only move when
    #THIS node's Nginx is the problem.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "nginx ok\n";
    }

    #### /health IS DELIBERATELY NOT SPECIAL-CASED HERE ####
    #
    #It falls through to `location /` below and is balanced across both nodes
    #like any other request. Pinning it to the local app with a
    #`location = /health { proxy_pass http://127.0.0.1:8000/health; }` was
    #tried and reverted, and the reasons are worth keeping because the idea is
    #superficially appealing:
    #
    #  1. Every evidence tool in this repo attributes a request to a node by
    #     reading the `node` field out of a /health response — watch-uptime.sh,
    #     k6/baseline.js (which says so in as many words), k6/rolling-update.js.
    #     Pinned locally, all three report a single node forever and the
    #     zero-downtime evidence quietly becomes worthless. Nothing warns: the
    #     node field is still present, it just never changes.
    #
    #  2. Worse, proxy_next_upstream in `location /` IS the zero-downtime
    #     mechanism. Bypassing the upstream means scripts/pool.sh draining a
    #     node has no effect on /health, so a drained node keeps answering from
    #     its own restarting container with no retry — manufacturing the exact
    #     dropped requests rolling-update.js exists to detect.
    #
    #The concern that motivated it is real but belongs at a different layer: a
    #consumer asking "is THIS node healthy?" must not accept an answer from the
    #peer. The fix is to ask the app directly on :8000 rather than through the
    #load balancer, which is what the health monitor's per-node endpoints do.
    #Routing a per-node question through the thing whose job is to hide which
    #node you reached is the mistake — not this file's behaviour.
    #
    #Note "node-local" in README.md's endpoint table describes the DATA (no
    #network calls, no Prometheus dependency), not which node answers when the
    #request arrives via the LB. Easy to conflate; they are unrelated.

    #The health monitor's HTML report, served as a static file — never
    #proxied. The report describes THIS host: its failed units, journal error
    #counts, whether it holds the VIP. Routing it through the app tier would
    #make the page about a node's health unavailable in precisely the
    #situation it is written for, and through brp_backend it could be answered
    #by the other node entirely — a report about node2 served at node1's URL.
    #
    #DEPENDENCY — this serves 404 until the monitor is changed. The unit runs
    #`--html report.html`, a RELATIVE path landing in the unit's
    #WorkingDirectory, and ProtectHome=yes blocks writing under /home at all.
    #It must be pointed at the absolute path below, and the directory created:
    #
    #    sudo install -d -m 755 /var/www/health
    #
    #Allow-listed rather than public: the report exposes hostnames, unit names
    #and journal error counts, and this is a populated LAN, not an isolated
    #management segment.
    location = /report {
        alias /var/www/health/report.html;
        default_type text/html;

        #A cached health report is a stale health report, which is worse than
        #no report — it reads as current.
        add_header Cache-Control "no-store";

        allow 127.0.0.1;
        allow 192.168.71.251;   #node1
        allow 192.168.71.252;   #node2
        #allow 192.168.68.69;   #workstation — DHCP, so prefer a reservation
                                #over editing this file each time it moves
        deny all;
    }

    location / {
        proxy_pass http://brp_backend;

        #required for upstream keepalive to actually engage
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        #Fail fast. A node being restarted mid-rolling-update refuses the
        #connection immediately, but a wedged one would otherwise hold the
        #request for the default 60s and turn a deploy into visible downtime.
        proxy_connect_timeout 2s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        #This is the mechanism that delivers zero downtime, not the weights.
        #When the node being updated drops a request, Nginx silently retries it
        #on the surviving node and the client sees one clean 200. Without it,
        #every in-flight request during a container restart becomes a 502.
        proxy_next_upstream          error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries    2;
        proxy_next_upstream_timeout  5s;
    }
}
