#/etc/nginx/conf.d/brp-upstream.conf  (both nodes — each nginx balances both apps)
#
#This file exists on its own so a rolling update touches exactly one small,
#reviewable file. The procedure in RUNBOOK.md comments out a server line here,
#runs `nginx -s reload`, and puts it back — nothing else in the Nginx config
#is edited during a deploy. Kept in sync across both nodes (identical content).
#
#Sorts before brp.conf under the conf.d/*.conf glob, so the upstream is parsed
#before the server block that references it.

upstream brp_backend {
    #Equal weights, because the two nodes are identical hardware. This is a
    #measured result, not an assumption: k6/baseline.js reports the observed
    #per-node split and per-node p95, and 1:1 held. The weight= syntax is kept
    #rather than dropped so that if the fleet ever becomes heterogeneous the
    #mechanism is already in place and correctly parameterised — and so the
    #1:1 reads as a deliberate finding rather than an omission.
    #
    #The nodes differ by OS (Ubuntu 26.04 / Rocky 10.2), not by capacity. Any
    #latency divergence between them is therefore attributable to the OS or its
    #configuration, since the hardware is controlled for.
    #
    #max_fails/fail_timeout are PASSIVE checks: Nginx OSS has no active health
    #probing (that is nginx-plus only), so a node is only ejected after real
    #client requests to it fail. It does not poll /health. Consequence: the
    #first request or two after a node dies still get routed to it, which is
    #why proxy_next_upstream in brp.conf matters — that retry is what keeps
    #those requests from reaching the client as errors.
    server 192.168.71.251:8000 weight=1 max_fails=2 fail_timeout=10s;  #node1
    server 192.168.71.252:8000 weight=1 max_fails=2 fail_timeout=10s;  #node2

    #reuse upstream connections; without this every proxied request pays a
    #fresh TCP handshake, which shows up as latency on the slower node.
    keepalive 16;
}
